# Po kazdem pushi do main sestavi doplnek (npm run build) a nasadi slozku dist na GitHub Pages.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Kontrola, ze jsou vyplnene ID z Entra
        run: |
          if grep -q "VLOZ_CLIENT_ID\|VLOZ_TENANT_ID" src/config.js; then
            echo "::error::V src/config.js chybi CLIENT_ID nebo TENANT_ID"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
